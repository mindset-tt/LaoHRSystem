# Phase 6e — Local docker-compose for the LaoHR stack.
#
# Three services:
#   - postgres: primary database
#   - api:     .NET 10 API (Phase 6 healthchecks + Serilog + retention)
#   - web:     Next.js frontend (standalone output)
#
# Notes for production:
#   - All secrets (Jwt__Key, ConnectionStrings__DefaultConnection, SMTP) MUST be
#     supplied via env / secret manager. The compose file uses placeholders so
#     accidental `docker compose up` against a real host can't leak a key.
#   - Bind-mounts are intentionally absent: production images are self-contained.
#   - Health checks gate `depends_on` so the API only starts after Postgres is ready.

services:
  postgres:
    image: postgres:16-alpine
    container_name: laohr-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: laohr
      POSTGRES_USER: laohr
      # Override via .env file or CI secret store.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # Phase 4D — do NOT publish the DB port to the host. The API reaches it over
    # the internal compose network only. Uncomment for local debugging only.
    # ports:
    #   - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laohr -d laohr"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./Backend
      dockerfile: LaoHR.API/Dockerfile
    container_name: laohr-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=laohr;Username=laohr;Password=${POSTGRES_PASSWORD}"
      Jwt__Key: ${JWT_KEY:?JWT_KEY must be set (>=64 chars)}
      Jwt__Issuer: LaoHRServer
      Jwt__Audience: LaoHRClient
      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS must be set}
      Serilog__WriteToFile: "false"
      Retention__Enabled: "true"
      Retention__AuditLogDays: "365"
      Retention__RefreshTokenDays: "30"
      # OpenTelemetry: leave Otlp endpoint unset for a console-only debug export.
      OpenTelemetry__Otlp__Endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    depends_on:
      postgres:
        condition: service_healthy
    # Phase 4D — the API is internal-only; the reverse proxy (TLS) fronts it.
    # Do not publish 8080 to the host in production.
    # ports:
    #   - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    container_name: laohr-web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NODE_ENV: production
      # Bind all interfaces so localhost healthchecks work in containers.
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  postgres-data:
    name: laohr-postgres-data
